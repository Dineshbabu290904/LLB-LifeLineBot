[server]
root_url = %(protocol)s://%(domain)s/grafana/
serve_from_sub_path = true

[auth.anonymous]
enabled = true
org_role = Viewer

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/medbot-overview.json

[analytics]
reporting_enabled = false
check_for_updates = false
