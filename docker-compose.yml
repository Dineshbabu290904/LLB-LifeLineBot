version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# MEDBOT – Full-platform Docker Compose
# 59 microservices + MongoDB + PostgreSQL + Redis + Ollama
# ─────────────────────────────────────────────────────────────────────────────

networks:
  medbot-network:
    driver: bridge

volumes:
  mongodb_data:
  postgresql_data:
  redis_data:
  ollama_data:
  faiss_data:

# ─── Shared environment anchor ───────────────────────────────────────────────
x-common-env: &common-env
  MONGO_URL: mongodb://mongodb:27017
  POSTGRES_URL: postgresql://medbot_user:medbot_pass@postgresql:5432/medbot
  REDIS_URL: redis://redis:6379
  OLLAMA_BASE_URL: http://ollama:11434
  ENVIRONMENT: development
  LOG_LEVEL: INFO
  JWT_SECRET_KEY: medbot-secret-key-change-in-production

x-infra-depends: &infra-depends
  depends_on:
    mongodb:
      condition: service_healthy
    postgresql:
      condition: service_healthy
    redis:
      condition: service_healthy

x-restart: &restart
  restart: unless-stopped

services:

  # ═══════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ═══════════════════════════════════════════════════════════════════════════

  mongodb:
    image: mongo:7
    <<: *restart
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - medbot-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgresql:
    image: postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_USER: medbot_user
      POSTGRES_PASSWORD: medbot_pass
      POSTGRES_DB: medbot
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - medbot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medbot_user -d medbot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    <<: *restart
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - medbot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    <<: *restart
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - medbot-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════════════════
  # CORE / GATEWAY
  # ═══════════════════════════════════════════════════════════════════════════

  api_gateway:
    build: ./services/api_gateway
    <<: [*restart, *infra-depends]
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
    networks:
      - medbot-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

